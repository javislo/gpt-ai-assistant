name: One-time formatter for PR 2
on:
  push:
    branches:
      - claude/cloud-environment-setup-bdcpo4
    paths:
      - .github/workflows/pr2-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/cloud-environment-setup-bdcpo4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply ESLint safe autofixes
        run: npx eslint . --fix || true
      - name: Commit formatting only to this PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "style: apply ESLint autofixes for async agent"
            git push origin HEAD:claude/cloud-environment-setup-bdcpo4
          fi
